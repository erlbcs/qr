<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no">

<title>Consulta de Entradas y Salidas</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f6f9;
  color: #1f2937;
}

.app {
  max-width: 540px;
  margin: auto;
  min-height: 100vh;
  background: #ffffff;
}

.header {
  background: #173b65;
  color: white;
  text-align: center;
  padding: 22px 16px;
}

.escuela {
  font-size: 19px;
  font-weight: bold;
  line-height: 1.3;
}

.titulo {
  margin-top: 7px;
  font-size: 15px;
}

.contenido {
  padding: 18px;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
  background: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: #2563eb;
}

#curp,
#codigo {
  text-transform: uppercase;
  margin-bottom: 15px;
}

.btnConsultar {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #173b65;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.btnConsultar:disabled {
  opacity: .6;
}

#procesando {
  display: none;
  margin-top: 12px;
  text-align: center;
  font-weight: bold;
  color: #173b65;
}

#error {
  display: none;
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  background: #fee2e2;
  border: 2px solid #ef4444;
  color: #991b1b;
  text-align: center;
  font-weight: bold;
}

#resultado {
  display: none;
}

.sesionInfo {
  margin-bottom: 12px;
  padding: 10px;
  background: #eff6ff;
  border-radius: 9px;
  text-align: center;
  color: #1e40af;
  font-size: 13px;
}

.alumnoNombre {
  font-size: 23px;
  font-weight: bold;
  text-align: center;
  line-height: 1.25;
}

.alumnoDatos {
  margin-top: 8px;
  text-align: center;
  font-size: 17px;
  color: #4b5563;
}

.estado {
  margin-top: 16px;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}

.estadoDentro {
  background: #dcfce7;
  border: 2px solid #22c55e;
  color: #166534;
}

.estadoSalida {
  background: #dbeafe;
  border: 2px solid #3b82f6;
  color: #1e40af;
}

.estadoSinRegistro {
  background: #f3f4f6;
  border: 2px solid #9ca3af;
  color: #374151;
}

.estadoTitulo {
  font-size: 14px;
  font-weight: bold;
}

.estadoTexto {
  margin-top: 5px;
  font-size: 22px;
  font-weight: bold;
}

.seccionTitulo {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
}

.movimientosHoy {
  display: flex;
  gap: 10px;
}

.movimientoHoy {
  flex: 1;
  padding: 14px 8px;
  border-radius: 10px;
  text-align: center;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
}

.tipoMovimiento {
  font-size: 14px;
  font-weight: bold;
  color: #4b5563;
}

.horaMovimiento {
  margin-top: 5px;
  font-size: 22px;
  font-weight: bold;
}

.filtros {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btnFiltro {
  padding: 11px 6px;
  border: 2px solid #d1d5db;
  border-radius: 9px;
  background: white;
  color: #374151;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.btnFiltro.activo {
  background: #173b65;
  border-color: #173b65;
  color: white;
}

.rangoPersonalizado {
  display: none;
  margin-top: 14px;
  padding: 14px;
  border-radius: 10px;
  background: #f8fafc;
  border: 1px solid #e5e7eb;
}

.campoFecha {
  margin-bottom: 12px;
}

.btnAplicar {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #166534;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.resumenFiltro {
  margin-top: 14px;
  padding: 10px;
  border-radius: 8px;
  background: #f8fafc;
  text-align: center;
  color: #4b5563;
  font-size: 13px;
}

.diaCard {
  margin-bottom: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 11px;
  overflow: hidden;
}

.diaFecha {
  padding: 10px 12px;
  background: #f1f5f9;
  font-size: 15px;
  font-weight: bold;
}

.diaMovimientos {
  display: flex;
  gap: 8px;
  padding: 12px;
}

.diaMovimiento {
  flex: 1;
  padding: 11px 6px;
  border-radius: 8px;
  text-align: center;
}

.diaEntrada {
  background: #f0fdf4;
  color: #166534;
}

.diaSalida {
  background: #eff6ff;
  color: #1e40af;
}

.diaTipo {
  font-size: 12px;
  font-weight: bold;
}

.diaHora {
  margin-top: 5px;
  font-size: 18px;
  font-weight: bold;
}

.sinRegistros {
  text-align: center;
  color: #6b7280;
  padding: 22px;
}

.btnActualizar,
.btnCerrarSesion {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btnActualizar {
  border: 2px solid #173b65;
  background: white;
  color: #173b65;
}

.btnCerrarSesion {
  border: none;
  background: #991b1b;
  color: white;
}

.aviso {
  margin-top: 15px;
  font-size: 12px;
  line-height: 1.4;
  text-align: center;
  color: #6b7280;
}

@media (max-width: 380px) {

  .filtros {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="escuela">
      SECUNDARIA ERNESTO ROMERO LUCERO
    </div>

    <div class="titulo">
      CONSULTA DE ENTRADAS Y SALIDAS
    </div>

  </div>


  <div class="contenido">

    <div
      id="formulario"
      class="card">

      <label for="curp">
        CURP DEL ALUMNO
      </label>

      <input
        id="curp"
        type="text"
        maxlength="18"
        autocomplete="off"
        placeholder="Ingrese la CURP">


      <label for="codigo">
        CÓDIGO
      </label>

      <input
        id="codigo"
        type="password"
        maxlength="10"
        autocomplete="off"
        placeholder="Ingrese el código">


      <button
        id="btnConsultar"
        class="btnConsultar"
        onclick="consultar()">

        CONSULTAR

      </button>


      <div id="procesando">
        Consultando información...
      </div>


      <div id="error"></div>


      <div class="aviso">
        Si el acceso es correcto, este dispositivo
        recordará al alumno para futuras consultas.
      </div>

    </div>


    <div id="resultado">

      <div class="sesionInfo">
        Acceso guardado en este dispositivo.
      </div>


      <div class="card">

        <div
          id="nombreAlumno"
          class="alumnoNombre">
        </div>

        <div
          id="datosAlumno"
          class="alumnoDatos">
        </div>

        <div
          id="estadoActual"
          class="estado">
        </div>

      </div>


      <div class="card">

        <div class="seccionTitulo">
          REGISTRO DE HOY
        </div>

        <div
          id="fechaHoy"
          style="
            margin-bottom:12px;
            font-size:14px;
            color:#6b7280;
          ">
        </div>


        <div class="movimientosHoy">

          <div class="movimientoHoy">

            <div class="tipoMovimiento">
              ENTRADA
            </div>

            <div
              id="horaEntrada"
              class="horaMovimiento">
              --
            </div>

          </div>


          <div class="movimientoHoy">

            <div class="tipoMovimiento">
              SALIDA
            </div>

            <div
              id="horaSalida"
              class="horaMovimiento">
              --
            </div>

          </div>

        </div>

      </div>


      <div class="card">

        <div class="seccionTitulo">
          HISTORIAL
        </div>


        <div class="filtros">

          <button
            id="filtroHoy"
            class="btnFiltro"
            onclick="seleccionarFiltro('HOY')">

            HOY

          </button>


          <button
            id="filtro7"
            class="btnFiltro activo"
            onclick="seleccionarFiltro('7')">

            ÚLTIMOS 7 DÍAS

          </button>


          <button
            id="filtro30"
            class="btnFiltro"
            onclick="seleccionarFiltro('30')">

            ÚLTIMOS 30 DÍAS

          </button>


          <button
            id="filtroRango"
            class="btnFiltro"
            onclick="seleccionarFiltro('RANGO')">

            RANGO DE FECHAS

          </button>

        </div>


        <div
          id="rangoPersonalizado"
          class="rangoPersonalizado">


          <div class="campoFecha">

            <label for="fechaInicio">
              FECHA INICIAL
            </label>

            <input
              id="fechaInicio"
              type="date">

          </div>


          <div class="campoFecha">

            <label for="fechaFin">
              FECHA FINAL
            </label>

            <input
              id="fechaFin"
              type="date">

          </div>


          <button
            class="btnAplicar"
            onclick="aplicarRango()">

            APLICAR RANGO

          </button>

        </div>


        <div
          id="resumenFiltro"
          class="resumenFiltro">
        </div>


        <div
          id="historial"
          style="margin-top:14px;">
        </div>

      </div>


      <button
        class="btnActualizar"
        onclick="actualizarConsulta()">

        ACTUALIZAR REGISTROS

      </button>


      <button
        class="btnCerrarSesion"
        onclick="cerrarSesion()">

        CERRAR SESIÓN / CAMBIAR ALUMNO

      </button>

    </div>

  </div>

</div>


<script>

/*
=================================================
PEGA AQUÍ TU URL /exec ACTUAL DE APPS SCRIPT
=================================================
*/

const URL_API =
  'https://script.google.com/macros/s/AKfycbxeeSfxFcOKTFAbm8HMa8fGm_xpCAafd_HDfChpsBkiDoQbNMwG80ZjT0u1Ck1J4R1O/exec';


const CLAVE_CURP =
  'control_escolar_curp';

const CLAVE_CODIGO =
  'control_escolar_codigo';


let consultando =
  false;

let historialCompleto =
  [];

let filtroActual =
  '7';


/*
=================================================
RECUPERAR SESIÓN
=================================================
*/

window.addEventListener(
  'load',
  function() {

    const curpGuardada =
      localStorage.getItem(
        CLAVE_CURP
      );

    const codigoGuardado =
      localStorage.getItem(
        CLAVE_CODIGO
      );


    if (
      curpGuardada &&
      codigoGuardado
    ) {

      document
        .getElementById('curp')
        .value =
        curpGuardada;


      document
        .getElementById('codigo')
        .value =
        codigoGuardado;


      consultar(true);

    }

  }
);


/*
=================================================
CONSULTAR
=================================================
*/

function consultar(
  consultaAutomatica = false
) {

  if (consultando) {
    return;
  }


  const curp =
    limpiarTexto(
      document
        .getElementById('curp')
        .value
    );


  const codigo =
    limpiarTexto(
      document
        .getElementById('codigo')
        .value
    );


  ocultarError();


  if (!curp) {

    if (!consultaAutomatica) {

      mostrarError(
        'Ingresa la CURP del alumno.'
      );

    }

    return;

  }


  if (!codigo) {

    if (!consultaAutomatica) {

      mostrarError(
        'Ingresa el código.'
      );

    }

    return;

  }


  if (
    URL_API.includes(
      'PEGA_AQUI'
    )
  ) {

    mostrarError(
      'La página no tiene configurada la URL de Apps Script.'
    );

    return;

  }


  consultando =
    true;


  document
    .getElementById('btnConsultar')
    .disabled =
    true;


  document
    .getElementById('procesando')
    .style
    .display =
    'block';


  enviarConsulta(
    curp,
    codigo,
    consultaAutomatica
  );

}


/*
=================================================
ENVIAR CONSULTA
=================================================
*/

function enviarConsulta(
  curp,
  codigo,
  consultaAutomatica
) {

  const callback =
    'respuestaConsulta_' +
    Date.now();


  const script =
    document.createElement(
      'script'
    );


  const limpiar =
    () => {

      try {

        delete window[
          callback
        ];

      }
      catch (e) {}


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }

    };


  window[callback] =
    function(resultado) {

      limpiar();


      consultando =
        false;


      document
        .getElementById('btnConsultar')
        .disabled =
        false;


      document
        .getElementById('procesando')
        .style
        .display =
        'none';


      procesarConsulta(
        resultado,
        curp,
        codigo,
        consultaAutomatica
      );

    };


  script.onerror =
    function() {

      limpiar();

      consultando =
        false;


      document
        .getElementById('btnConsultar')
        .disabled =
        false;


      document
        .getElementById('procesando')
        .style
        .display =
        'none';


      mostrarError(
        'No fue posible comunicarse con el sistema.'
      );

    };


  const parametros =
    new URLSearchParams({

      accion:
        'consultar',

      curp:
        curp,

      codigo:
        codigo,

      callback:
        callback

    });


  script.src =
    URL_API +
    '?' +
    parametros.toString();


  document.body
    .appendChild(
      script
    );

}


/*
=================================================
PROCESAR RESULTADO
=================================================
*/

function procesarConsulta(
  resultado,
  curp,
  codigo,
  consultaAutomatica
) {

  if (
    !resultado ||
    !resultado.ok
  ) {

    if (
      consultaAutomatica
    ) {

      borrarSesion();

    }


    mostrarFormulario();


    mostrarError(
      resultado &&
      resultado.mensaje
        ? resultado.mensaje
        : 'No fue posible realizar la consulta.'
    );


    return;

  }


  localStorage.setItem(
    CLAVE_CURP,
    curp
  );


  localStorage.setItem(
    CLAVE_CODIGO,
    codigo
  );


  const alumno =
    resultado.alumno;


  const nombreCompleto =
    [

      alumno.nombre,

      alumno.primerApellido,

      alumno.segundoApellido

    ]
      .filter(Boolean)
      .join(' ');


  document
    .getElementById(
      'nombreAlumno'
    )
    .textContent =
    nombreCompleto;


  document
    .getElementById(
      'datosAlumno'
    )
    .innerHTML =

    escapar(
      alumno.grado
    ) +
    '° ' +
    escapar(
      alumno.grupo
    ) +
    ' &nbsp; • &nbsp; ' +
    escapar(
      alumno.turno
    );


  mostrarEstado(
    resultado.estadoActual
  );


  document
    .getElementById(
      'fechaHoy'
    )
    .textContent =
    resultado.hoy &&
    resultado.hoy.fecha
      ? resultado.hoy.fecha
      : '';


  document
    .getElementById(
      'horaEntrada'
    )
    .textContent =
    resultado.hoy &&
    resultado.hoy.entrada
      ? resultado.hoy.entrada
      : '--';


  document
    .getElementById(
      'horaSalida'
    )
    .textContent =
    resultado.hoy &&
    resultado.hoy.salida
      ? resultado.hoy.salida
      : '--';


  historialCompleto =
    resultado.historial || [];


  aplicarFiltroActual();


  mostrarResultado();

}


/*
=================================================
FILTROS
=================================================
*/

function seleccionarFiltro(
  filtro
) {

  filtroActual =
    filtro;


  document
    .querySelectorAll(
      '.btnFiltro'
    )
    .forEach(
      boton =>
        boton.classList.remove(
          'activo'
        )
    );


  const mapa = {

    HOY:
      'filtroHoy',

    '7':
      'filtro7',

    '30':
      'filtro30',

    RANGO:
      'filtroRango'

  };


  document
    .getElementById(
      mapa[filtro]
    )
    .classList
    .add(
      'activo'
    );


  const rango =
    document
      .getElementById(
        'rangoPersonalizado'
      );


  if (
    filtro === 'RANGO'
  ) {

    rango.style.display =
      'block';

  }

  else {

    rango.style.display =
      'none';

    aplicarFiltroActual();

  }

}


function aplicarFiltroActual() {

  if (
    filtroActual === 'RANGO'
  ) {

    aplicarRango();

    return;

  }


  const hoy =
    inicioDia(
      new Date()
    );


  let fechaDesde;
  let fechaHasta =
    finDia(
      new Date()
    );


  if (
    filtroActual === 'HOY'
  ) {

    fechaDesde =
      hoy;

  }


  else if (
    filtroActual === '7'
  ) {

    fechaDesde =
      new Date(
        hoy
      );

    fechaDesde.setDate(
      fechaDesde.getDate() - 6
    );

  }


  else {

    fechaDesde =
      new Date(
        hoy
      );

    fechaDesde.setDate(
      fechaDesde.getDate() - 29
    );

  }


  const filtrados =
    filtrarHistorial(
      fechaDesde,
      fechaHasta
    );


  mostrarHistorialAgrupado(
    filtrados
  );


  let texto =
    '';


  if (
    filtroActual === 'HOY'
  ) {

    texto =
      'Mostrando registros de hoy';

  }

  else if (
    filtroActual === '7'
  ) {

    texto =
      'Mostrando los últimos 7 días';

  }

  else {

    texto =
      'Mostrando los últimos 30 días';

  }


  actualizarResumen(
    texto,
    filtrados.length
  );

}


function aplicarRango() {

  const inicio =
    document
      .getElementById(
        'fechaInicio'
      )
      .value;


  const fin =
    document
      .getElementById(
        'fechaFin'
      )
      .value;


  if (
    !inicio ||
    !fin
  ) {

    document
      .getElementById(
        'resumenFiltro'
      )
      .textContent =
      'Selecciona la fecha inicial y final.';

    return;

  }


  let fechaDesde =
    crearFechaLocalISO(
      inicio
    );


  let fechaHasta =
    crearFechaLocalISO(
      fin
    );


  if (
    fechaDesde >
    fechaHasta
  ) {

    document
      .getElementById(
        'resumenFiltro'
      )
      .textContent =
      'La fecha inicial no puede ser posterior a la fecha final.';

    return;

  }


  fechaDesde =
    inicioDia(
      fechaDesde
    );


  fechaHasta =
    finDia(
      fechaHasta
    );


  const filtrados =
    filtrarHistorial(
      fechaDesde,
      fechaHasta
    );


  mostrarHistorialAgrupado(
    filtrados
  );


  actualizarResumen(
    'Rango seleccionado',
    filtrados.length
  );

}


function filtrarHistorial(
  desde,
  hasta
) {

  return historialCompleto.filter(
    registro => {

      const fecha =
        convertirFechaRegistro(
          registro.fecha
        );


      if (!fecha) {
        return false;
      }


      return (
        fecha >= desde &&
        fecha <= hasta
      );

    }
  );

}


/*
=================================================
MOSTRAR HISTORIAL POR DÍA
=================================================
*/

function mostrarHistorialAgrupado(
  registros
) {

  const contenedor =
    document
      .getElementById(
        'historial'
      );


  if (
    !registros ||
    registros.length === 0
  ) {

    contenedor.innerHTML = `

      <div class="sinRegistros">

        No existen registros
        en el periodo seleccionado.

      </div>

    `;

    return;

  }


  const dias =
    {};


  registros.forEach(
    registro => {

      if (
        !dias[
          registro.fecha
        ]
      ) {

        dias[
          registro.fecha
        ] = {

          entrada:
            null,

          salida:
            null

        };

      }


      const movimiento =
        String(
          registro.movimiento || ''
        )
          .toUpperCase();


      if (
        movimiento ===
        'ENTRADA'
      ) {

        /*
        Como los registros vienen
        de reciente a antiguo,
        conservamos la entrada más antigua
        de ese día.
        */

        dias[
          registro.fecha
        ].entrada =
          registro.hora;

      }


      if (
        movimiento ===
        'SALIDA' &&
        !dias[
          registro.fecha
        ].salida
      ) {

        /*
        Conservamos la salida
        más reciente del día.
        */

        dias[
          registro.fecha
        ].salida =
          registro.hora;

      }

    }
  );


  const fechas =
    Object.keys(
      dias
    );


  fechas.sort(
    function(a, b) {

      return (
        convertirFechaRegistro(b) -
        convertirFechaRegistro(a)
      );

    }
  );


  let html =
    '';


  fechas.forEach(
    fecha => {

      const dia =
        dias[
          fecha
        ];


      html += `

        <div class="diaCard">

          <div class="diaFecha">

            ${escapar(
              formatearFechaBonita(
                fecha
              )
            )}

          </div>


          <div class="diaMovimientos">

            <div
              class="
                diaMovimiento
                diaEntrada
              ">

              <div class="diaTipo">
                ENTRADA
              </div>

              <div class="diaHora">

                ${
                  dia.entrada
                    ? escapar(
                        dia.entrada
                      )
                    : '--'
                }

              </div>

            </div>


            <div
              class="
                diaMovimiento
                diaSalida
              ">

              <div class="diaTipo">
                SALIDA
              </div>

              <div class="diaHora">

                ${
                  dia.salida
                    ? escapar(
                        dia.salida
                      )
                    : '--'
                }

              </div>

            </div>

          </div>

        </div>

      `;

    }
  );


  contenedor.innerHTML =
    html;

}

/*
=================================================
FECHAS
=================================================
*/

function convertirFechaRegistro(
  fecha
) {

  const partes =
    String(
      fecha || ''
    )
      .split('/');


  if (
    partes.length !== 3
  ) {

    return null;

  }


  return new Date(

    Number(
      partes[2]
    ),

    Number(
      partes[1]
    ) - 1,

    Number(
      partes[0]
    ),

    12,
    0,
    0

  );

}


function crearFechaLocalISO(
  valor
) {

  const partes =
    String(
      valor
    )
      .split('-');


  return new Date(

    Number(
      partes[0]
    ),

    Number(
      partes[1]
    ) - 1,

    Number(
      partes[2]
    ),

    12,
    0,
    0

  );

}


function inicioDia(
  fecha
) {

  const copia =
    new Date(
      fecha
    );


  copia.setHours(
    0,
    0,
    0,
    0
  );


  return copia;

}


function finDia(
  fecha
) {

  const copia =
    new Date(
      fecha
    );


  copia.setHours(
    23,
    59,
    59,
    999
  );


  return copia;

}


function formatearFechaBonita(
  fecha
) {

  const objeto =
    convertirFechaRegistro(
      fecha
    );


  if (!objeto) {
    return fecha;
  }


  return objeto
    .toLocaleDateString(
      'es-MX',
      {

        weekday:
          'long',

        day:
          '2-digit',

        month:
          'long',

        year:
          'numeric'

      }
    );

}

function limpiarTexto(
  valor
) {

  return String(
    valor || ''
  )
    .trim()
    .toUpperCase()
    .replace(
      /\s+/g,
      ''
    );

}


function escapar(
  valor
) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    String(
      valor ?? ''
    );


  return div.innerHTML;

}
