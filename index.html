<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no">

<title>Control de Acceso</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f6f9;
  font-family: Arial, Helvetica, sans-serif;
  color: #1f2937;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

.header {
  background: #173b65;
  color: white;
  text-align: center;
  padding: 16px 12px;
}

.escuela {
  font-size: 17px;
  font-weight: bold;
}

.titulo {
  margin-top: 5px;
  font-size: 14px;
}

.contenido {
  padding: 14px;
}

.movimientos {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.movimiento {
  flex: 1;
  padding: 11px;
  border: 2px solid #d1d5db;
  border-radius: 10px;
  background: white;
  font-size: 17px;
  font-weight: bold;
}

.movimiento.activo {
  background: #173b65;
  border-color: #173b65;
  color: white;
}

.camara {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  background: #166534;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.info {
  margin-bottom: 8px;
  text-align: center;
  color: #4b5563;
  font-size: 13px;
}

/* VISOR MÁS PEQUEÑO */
#reader {
  width: 100%;
  max-width: 320px;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: black;
}

/* Reduce la altura visual del video */
#reader video {
  max-height: 240px !important;
  object-fit: cover;
}

.procesando {
  display: none;
  text-align: center;
  padding: 10px;
  font-weight: bold;
  color: #173b65;
}

.resultado {
  display: none;
  margin-top: 12px;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}

.correcto {
  background: #dcfce7;
  border: 3px solid #22c55e;
  color: #166534;
}

.error {
  background: #fee2e2;
  border: 3px solid #ef4444;
  color: #991b1b;
}

.duplicado {
  background: #fef3c7;
  border: 3px solid #f59e0b;
  color: #92400e;
}

.resultadoTitulo {
  font-size: 24px;
  font-weight: bold;
}

.nombre {
  margin-top: 10px;
  font-size: 22px;
  font-weight: bold;
  line-height: 1.25;
}

.datos {
  margin-top: 8px;
  font-size: 18px;
  line-height: 1.4;
}

.movimientoResultado {
  margin-top: 10px;
  font-size: 24px;
  font-weight: bold;
}


/* ACCESO AL LECTOR QR */
.loginCard {
  margin-bottom: 14px;
  padding: 18px;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}
.loginTitulo { text-align:center; font-size:21px; font-weight:bold; margin-bottom:18px; }
.loginCampo { margin-bottom:14px; }
.loginCampo label { display:block; margin-bottom:6px; font-size:13px; font-weight:bold; }
.loginCampo input { width:100%; padding:13px; border:2px solid #d1d5db; border-radius:9px; font-size:16px; outline:none; }
.loginCampo input:focus { border-color:#2563eb; }
.btnLogin { width:100%; padding:14px; border:0; border-radius:10px; background:#173b65; color:#fff; font-size:17px; font-weight:bold; }
.loginError { display:none; margin-top:12px; padding:12px; border-radius:9px; background:#fee2e2; border:2px solid #ef4444; color:#991b1b; text-align:center; font-weight:bold; }
.usuarioLector { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; padding:10px 12px; border-radius:9px; background:#eff6ff; color:#1e40af; font-size:13px; }
.usuarioLector strong { display:block; }
.btnCerrarQR { border:0; border-radius:8px; padding:8px 10px; background:#991b1b; color:#fff; font-weight:bold; }
.oculto { display:none !important; }

</style>

</head>

<body>

<div class="app">

<div class="header">

  <div class="escuela">
    SECUNDARIA ERNESTO ROMERO LUCERO
  </div>

  <div class="titulo">
    CONTROL DE ACCESO
  </div>

</div>

<div class="contenido">

<div id="pantallaLoginQR" class="loginCard">
  <div class="loginTitulo">ACCESO AL LECTOR QR</div>
  <div class="loginCampo">
    <label for="usuarioQR">USUARIO</label>
    <input id="usuarioQR" type="text" autocomplete="username" placeholder="Ingrese su usuario">
  </div>
  <div class="loginCampo">
    <label for="contrasenaQR">CONTRASEÑA</label>
    <input id="contrasenaQR" type="password" autocomplete="current-password" placeholder="Ingrese su contraseña">
  </div>
  <button id="btnIngresarQR" class="btnLogin" onclick="iniciarSesionQR()">INGRESAR</button>
  <div id="errorLoginQR" class="loginError"></div>
</div>

<div id="pantallaLectorQR" class="oculto">
  <div class="usuarioLector">
    <div><strong id="nombreUsuarioQR"></strong><span id="cuentaUsuarioQR"></span></div>
    <button class="btnCerrarQR" onclick="cerrarSesionQR()">CERRAR SESIÓN</button>
  </div>

<div class="movimientos">

<button
  id="entrada"
  class="movimiento activo"
  onclick="seleccionarMovimiento('ENTRADA')">

  ENTRADA

</button>

<button
  id="salida"
  class="movimiento"
  onclick="seleccionarMovimiento('SALIDA')">

  SALIDA

</button>

</div>

<button
  id="btnCamara"
  class="camara"
  onclick="iniciarCamara()">

  📷 INICIAR CÁMARA

</button>

<div class="info">
  Coloca el código QR dentro del recuadro.
</div>

<div id="reader"></div>

<div
  id="procesando"
  class="procesando">

  Procesando registro...

</div>

<div
  id="resultado"
  class="resultado">

</div>

</div><!-- /pantallaLectorQR -->

</div>

</div>

<script>

/*
=================================================
CONSERVA AQUÍ TU URL ACTUAL DE APPS SCRIPT
=================================================
*/

const URL_API =
  'https://script.google.com/macros/s/AKfycbzLZ-XGSlLsS0sbCnhI-SZ3bk5brOGrC9-7E__TOXMmjzRvRdIzThUwe_3Q6NxrtwPE/exec';
  /*'https://script.google.com/macros/s/AKfycbxeeSfxFcOKTFAbm8HMa8fGm_xpCAafd_HDfChpsBkiDoQbNMwG80ZjT0u1Ck1J4R1O/exec';
  https://script.google.com/macros/s/AKfycbzLZ-XGSlLsS0sbCnhI-SZ3bk5brOGrC9-7E__TOXMmjzRvRdIzThUwe_3Q6NxrtwPE/exec
  */
  
  


const CLAVE_TOKEN_QR = 'asistencia_qr_token';
let tokenQR = sessionStorage.getItem(CLAVE_TOKEN_QR) || '';
let usuarioQRActual = null;


let movimientoActual =
  'ENTRADA';

let lector =
  null;

let camaraActiva =
  false;

let procesando =
  false;

let ultimoQR =
  '';

let ultimaLectura =
  0;


/* CONTEXTO DE AUDIO REUTILIZABLE */
let audioContext =
  null;


function obtenerAudioContext() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if (
    audioContext.state === 'suspended'
  ) {

    audioContext.resume();

  }

  return audioContext;

}


function llamarApiQR(parametros, callbackResultado) {
  const requestId =
    'qr_' + Date.now() + '_' +
    Math.random().toString(36).slice(2, 12);

  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.setAttribute('aria-hidden', 'true');

  let terminado = false;

  function limpiar() {
    window.removeEventListener('message', recibirRespuesta);
    if (iframe.parentNode) {
      iframe.parentNode.removeChild(iframe);
    }
  }

  function finalizar(resultado) {
    if (terminado) return;
    terminado = true;
    clearTimeout(temporizador);
    limpiar();
    callbackResultado(resultado);
  }

  function recibirRespuesta(evento) {
    if (evento.source !== iframe.contentWindow) return;

    const datos = evento.data;

    if (
      !datos ||
      datos.tipo !== 'ASISTENCIA_API' ||
      datos.requestId !== requestId
    ) {
      return;
    }

    finalizar(datos.resultado);
  }

  window.addEventListener('message', recibirRespuesta);

  const temporizador = setTimeout(function() {
    finalizar({
      ok: false,
      mensaje: 'No fue posible comunicarse con el sistema.'
    });
  }, 15000);

  const parametrosEnvio = Object.assign({}, parametros, {
    transporte: 'iframe',
    requestId: requestId
  });

  iframe.src =
    URL_API + '?' +
    new URLSearchParams(parametrosEnvio).toString();

  document.body.appendChild(iframe);
}

async function sha256QR(texto) {
  const datos = new TextEncoder().encode(String(texto || ''));
  const hash = await crypto.subtle.digest('SHA-256', datos);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function iniciarSesionQR() {
  const usuario = String(document.getElementById('usuarioQR').value || '').trim().toUpperCase();
  const contrasena = String(document.getElementById('contrasenaQR').value || '');
  const error = document.getElementById('errorLoginQR');
  error.style.display = 'none';
  if (!usuario || !contrasena) {
    error.textContent = 'Ingresa usuario y contraseña.';
    error.style.display = 'block';
    return;
  }
  const btn = document.getElementById('btnIngresarQR');
  btn.disabled = true;
  try {
    const passwordHash = await sha256QR(contrasena);
    llamarApiQR({accion:'loginQR',usuario:usuario,passwordHash:passwordHash}, function(resultado) {
      btn.disabled = false;
      if (!resultado || !resultado.ok) {
        error.textContent = resultado && resultado.mensaje ? resultado.mensaje : 'No fue posible iniciar sesión.';
        error.style.display = 'block';
        return;
      }
      tokenQR = resultado.token;
      usuarioQRActual = resultado.usuario || {};
      sessionStorage.setItem(CLAVE_TOKEN_QR, tokenQR);
      document.getElementById('contrasenaQR').value = '';
      mostrarLectorAutorizado();
    });
  } catch(e) {
    btn.disabled = false;
    error.textContent = 'No fue posible procesar la contraseña.';
    error.style.display = 'block';
  }
}

function mostrarLectorAutorizado() {
  document.getElementById('pantallaLoginQR').classList.add('oculto');
  document.getElementById('pantallaLectorQR').classList.remove('oculto');
  document.getElementById('nombreUsuarioQR').textContent = usuarioQRActual && usuarioQRActual.nombre ? usuarioQRActual.nombre : 'USUARIO AUTORIZADO';
  document.getElementById('cuentaUsuarioQR').textContent = usuarioQRActual && usuarioQRActual.usuario ? usuarioQRActual.usuario : '';
}

function mostrarLoginQR() {
  document.getElementById('pantallaLectorQR').classList.add('oculto');
  document.getElementById('pantallaLoginQR').classList.remove('oculto');
}

function validarSesionQRGuardada() {
  if (!tokenQR) { mostrarLoginQR(); return; }
  llamarApiQR({accion:'validarQR',token:tokenQR}, function(resultado) {
    if (!resultado || !resultado.ok) { cerrarSesionQRLocal(); return; }
    usuarioQRActual = resultado.usuario || {};
    mostrarLectorAutorizado();
  });
}

function cerrarSesionQR() {
  const token = tokenQR;
  cerrarSesionQRLocal();
  if (token) llamarApiQR({accion:'logoutQR',token:token}, function(){});
}

function cerrarSesionQRLocal() {
  tokenQR = '';
  usuarioQRActual = null;
  sessionStorage.removeItem(CLAVE_TOKEN_QR);
  if (camaraActiva && lector) {
    lector.stop().then(() => { camaraActiva=false; lector=null; }).catch(() => {});
  }
  mostrarLoginQR();
}

window.addEventListener('load', validarSesionQRGuardada);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !document.getElementById('pantallaLoginQR').classList.contains('oculto')) iniciarSesionQR();
});


function seleccionarMovimiento(
  movimiento
) {

  movimientoActual =
    movimiento;

  document
    .getElementById('entrada')
    .classList
    .toggle(
      'activo',
      movimiento === 'ENTRADA'
    );

  document
    .getElementById('salida')
    .classList
    .toggle(
      'activo',
      movimiento === 'SALIDA'
    );

}


async function iniciarCamara() {

  if (
    URL_API.includes(
      'PEGA_AQUI'
    )
  ) {

    mostrarError(
      'Primero debes configurar la URL de Apps Script.'
    );

    return;

  }


  /* Activa audio desde interacción del usuario */
  obtenerAudioContext();


  if (camaraActiva) {
    return;
  }


  try {

    lector =
      new Html5Qrcode(
        'reader'
      );


    await lector.start(

      {
        facingMode:
          'environment'
      },

      {

        fps:
          12,

        qrbox: {
          width:
            190,

          height:
            190
        },

        aspectRatio:
          1.0

      },

      codigoDetectado,

      () => {}

    );


    camaraActiva =
      true;


    document
      .getElementById(
        'btnCamara'
      )
      .textContent =
      '✓ CÁMARA ACTIVA';

  }

  catch (error) {

    mostrarError(
      'No fue posible abrir la cámara: ' +
      error
    );

    sonidoError();

  }

}


function codigoDetectado(
  texto
) {

  if (procesando) {
    return;
  }


  const curp =
    String(
      texto || ''
    )
      .trim()
      .toUpperCase();


  if (!curp) {
    return;
  }


  const ahora =
    Date.now();


  if (
    curp === ultimoQR &&
    ahora - ultimaLectura < 3000
  ) {
    return;
  }


  ultimoQR =
    curp;


  ultimaLectura =
    ahora;


  procesando =
    true;


  document
    .getElementById(
      'procesando'
    )
    .style
    .display =
    'block';


  enviarRegistro(
    curp,
    movimientoActual
  );

}


function enviarRegistro(
  curp,
  movimiento
) {

  llamarApiQR(
    {
      accion: 'registrar',
      token: tokenQR,
      curp: curp,
      movimiento: movimiento
    },
    function(resultado) {

      procesando = false;

      document
        .getElementById('procesando')
        .style.display = 'none';

      if (!resultado) {
        mostrarError('No se recibió respuesta.');
        sonidoError();
        return;
      }

      procesarResultado(resultado);
    }
  );

}

function procesarResultado(
  resultado
) {

  if (!resultado) {

    mostrarError(
      'No se recibió respuesta.'
    );

    sonidoError();

    return;

  }


  if (
    resultado.tipo === 'SESION'
  ) {
    cerrarSesionQRLocal();
    mostrarError('Tu sesión ha expirado. Inicia sesión nuevamente.');
    sonidoError();
    return;
  }


  if (
    resultado.ok
  ) {

    mostrarCorrecto(
      resultado
    );

    sonidoCorrecto();

  }


  else if (
    resultado.tipo ===
    'DUPLICADO'
  ) {

    mostrarDuplicado(
      resultado
    );

    sonidoDuplicado();

  }


  else {

    mostrarError(
      resultado.mensaje ||
      'Error desconocido.'
    );

    sonidoError();

  }


  setTimeout(
    ocultarResultado,
    3000
  );

}


function mostrarCorrecto(
  resultado
) {

  const alumno =
    resultado.alumno;


  const nombre =
    [

      alumno.nombre,

      alumno.primerApellido,

      alumno.segundoApellido

    ]
    .filter(Boolean)
    .join(' ');


  const div =
    document
      .getElementById(
        'resultado'
      );


  div.className =
    'resultado correcto';


  div.innerHTML = `

    <div class="resultadoTitulo">
      ✓ REGISTRO CORRECTO
    </div>

    <div class="nombre">
      ${escapar(nombre)}
    </div>

    <div class="datos">

      ${escapar(alumno.grado)}°
      ${escapar(alumno.grupo)}

      <br>

      ${escapar(alumno.turno)}

    </div>

    <div class="movimientoResultado">
      ${escapar(resultado.movimiento)}
    </div>

    <div class="datos">

      ${escapar(resultado.fecha)}

      <br>

      ${escapar(resultado.hora)}

    </div>

  `;


  div.style.display =
    'block';

}


function mostrarDuplicado(
  resultado
) {

  const div =
    document
      .getElementById(
        'resultado'
      );


  div.className =
    'resultado duplicado';


  div.innerHTML = `

    <div class="resultadoTitulo">
      ⚠ REGISTRO DUPLICADO
    </div>

    <div class="datos">
      ${escapar(
        resultado.mensaje
      )}
    </div>

  `;


  div.style.display =
    'block';

}


function mostrarError(
  mensaje
) {

  const div =
    document
      .getElementById(
        'resultado'
      );


  div.className =
    'resultado error';


  div.innerHTML = `

    <div class="resultadoTitulo">
      ✕ ERROR
    </div>

    <div class="datos">
      ${escapar(mensaje)}
    </div>

  `;


  div.style.display =
    'block';

}


function ocultarResultado() {

  document
    .getElementById(
      'resultado'
    )
    .style
    .display =
    'none';

}


function escapar(
  texto
) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    String(
      texto ?? ''
    );


  return div.innerHTML;

}


/*
=================================================
SONIDOS MÁS FUERTES Y DIFERENTES
=================================================
*/


function reproducirTono(
  frecuencia,
  duracion,
  volumen,
  retraso = 0
) {

  setTimeout(
    () => {

      try {

        const ctx =
          obtenerAudioContext();


        const osc =
          ctx.createOscillator();


        const gain =
          ctx.createGain();


        osc.connect(
          gain
        );


        gain.connect(
          ctx.destination
        );


        osc.type =
          'square';


        osc.frequency.value =
          frecuencia;


        gain.gain.setValueAtTime(
          volumen,
          ctx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          ctx.currentTime + duracion
        );


        osc.start();


        osc.stop(
          ctx.currentTime +
          duracion
        );

      }

      catch (e) {}

    },

    retraso

  );

}


/* CORRECTO:
   dos tonos ascendentes */
function sonidoCorrecto() {

  reproducirTono(
    850,
    0.16,
    0.55,
    0
  );

  reproducirTono(
    1250,
    0.20,
    0.65,
    170
  );

}


/* DUPLICADO:
   tres tonos medios */
function sonidoDuplicado() {

  reproducirTono(
    600,
    0.17,
    0.65,
    0
  );

  reproducirTono(
    600,
    0.17,
    0.65,
    200
  );

  reproducirTono(
    600,
    0.20,
    0.70,
    400
  );

}


/* ERROR:
   tonos graves descendentes */
function sonidoError() {

  reproducirTono(
    350,
    0.22,
    0.70,
    0
  );

  reproducirTono(
    220,
    0.30,
    0.75,
    230
  );

}

</script>

</body>
